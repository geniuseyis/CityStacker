# Yalnizca guvenlik guncellemeleri; surum yukseltmeleri expo ile birlikte elle yapiliyor.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
